
name: Actualizar cuotas NFL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cuotas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install requests

      - name: Consultar cuotas reales NFL
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_nfl_odds.py

      - name: Verificar archivo generado
        run: |
          test -s data/nfl_odds_latest.json

      - name: Guardar cuotas en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl_odds_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar cuotas NFL"
            git push
          fi

      - name: Guardar respaldo descargable
        uses: actions/upload-artifact@v4
        with:
          name: nfl-current-odds
          path: data/nfl_odds_latest.json
          retention-days: 7
