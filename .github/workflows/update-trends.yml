
name: Actualizar tendencias NFL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 5,6'
    - cron: '0 12 * * 0'

permissions:
  contents: write

jobs:
  tendencias:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install pandas requests

      - name: Generar tendencias
        run: python build_nfl_trends.py

      - name: Guardar tendencias en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl_weekend_trends.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar tendencias NFL"
            git push
          fi

      - name: Guardar respaldo descargable
        uses: actions/upload-artifact@v4
        with:
          name: nfl-weekend-trends
          path: data/nfl_weekend_trends.json
          retention-days: 14
