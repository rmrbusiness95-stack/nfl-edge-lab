
name: Evaluar resultados NFL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * 9-12,1 2'

permissions:
  contents: write

concurrency:
  group: nfl-results-evaluation
  cancel-in-progress: false

jobs:
  evaluacion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install pandas requests

      - name: Evaluar marcadores finales
        run: python evaluate_nfl_results.py

      - name: Guardar resultados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prospective_results.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar evaluacion NFL"
            git push
          else
            echo "Sin cambios nuevos"
          fi

      - name: Respaldar evaluacion
        uses: actions/upload-artifact@v4
        with:
          name: nfl-prospective-results
          path: data/prospective_results.json
          if-no-files-found: error
          retention-days: 30
