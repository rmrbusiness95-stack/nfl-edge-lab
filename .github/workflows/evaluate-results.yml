
name: Evaluar resultados NFL

on:
  workflow_dispatch:
  schedule:
    # Martes 9 AM, hora de Arizona
    - cron: '0 16 * 9-12,1 2'

permissions:
  contents: write

concurrency:
  group: nfl-results-evaluation
  cancel-in-progress: false

jobs:
  evaluacion:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install pandas requests

      - name: Evaluar pronosticos originales
        run: python evaluate_nfl_results.py

      - name: Evaluar señales registradas
        run: |
          if find data/signal_snapshots -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            python evaluate_nfl_signals.py
          else
            echo "Aun no existen señales archivadas."
            echo "La evaluacion de señales comenzara cuando haya capturas."
          fi

      - name: Comprobar resultados
        run: |
          test -s data/prospective_results.json

          if [ -f data/signal_results.json ]; then
            test -s data/signal_results.json
          fi

      - name: Guardar resultados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prospective_results.json

          if [ -f data/signal_results.json ]; then
            git add data/signal_results.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar resultados y señales NFL"
            git push
          else
            echo "Sin cambios nuevos"
          fi

      - name: Respaldar evaluacion
        uses: actions/upload-artifact@v4
        with:
          name: nfl-evaluacion-completa
          path: |
            data/prospective_results.json
            data/signal_results.json
          if-no-files-found: error
          retention-days: 30
