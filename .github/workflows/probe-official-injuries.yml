
name: Probar fuente oficial de lesiones NFL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4

      - name: Comprobar acceso a NFL
        env:
          NFL_SEASON: '2026'
          NFL_WEEK: '5'
        run: python probe_official_nfl_injuries.py

      - name: Publicar diagnostico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official_injury_source_probe.json

          if ! git diff --cached --quiet; then
            git commit -m "Diagnosticar acceso a lesiones oficiales NFL"
            git push
          else
            echo "Sin cambios nuevos"
          fi

      - name: Guardar respaldo
        uses: actions/upload-artifact@v4
        with:
          name: nfl-official-injury-probe
          path: data/official_injury_source_probe.json
          if-no-files-found: error
          retention-days: 14
