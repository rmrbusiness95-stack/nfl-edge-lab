
name: Validar modelo NFL multianual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validacion:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install numpy pandas requests

      - name: Evaluar temporadas 2022 a 2025
        run: python validate_nfl_model.py

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: nfl-multiyear-validation
          path: data/model_multiyear_validation.json
          if-no-files-found: error
          retention-days: 14
