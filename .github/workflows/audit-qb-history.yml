
name: Auditar historial de quarterbacks NFL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install nflreadpy

      - name: Analizar quarterbacks 2018-2025
        run: python audit_qb_history.py

      - name: Comprobar resultado
        run: test -s data/qb_history_audit.json

      - name: Guardar auditoria en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/qb_history_audit.json

          if ! git diff --cached --quiet; then
            git commit -m "Auditar historial de quarterbacks NFL"
            git push
          else
            echo "Sin cambios nuevos"
          fi

      - name: Guardar respaldo
        uses: actions/upload-artifact@v4
        with:
          name: nfl-qb-history-audit
          path: data/qb_history_audit.json
          if-no-files-found: error
          retention-days: 30
