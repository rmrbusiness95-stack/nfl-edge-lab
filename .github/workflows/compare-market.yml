
name: Comparar modelo vs mercado NFL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparacion:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install numpy pandas requests

      - name: Comparar contra mercado historico
        run: python compare_nfl_market.py

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: nfl-market-benchmark
          path: data/market_benchmark_diagnostic.json
          if-no-files-found: error
          retention-days: 14
