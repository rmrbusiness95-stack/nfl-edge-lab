name: Actualizar datos NFL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install pandas pyarrow requests

      - name: Calcular estadisticas NFL
        run: python build_nfl_stats.py

      - name: Conservar resultados
        uses: actions/upload-artifact@v4
        with:
          name: nfl-team-week-stats
          path: data/team_week_stats.json
          if-no-files-found: error
          retention-days: 14
