
name: Diagnosticar errores NFL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install numpy pandas requests

      - name: Analizar errores del modelo
        run: python diagnose_nfl_model.py

      - name: Guardar diagnostico
        uses: actions/upload-artifact@v4
        with:
          name: nfl-model-error-diagnostics
          path: data/model_error_diagnostics.json
          if-no-files-found: error
          retention-days: 14
