
name: Probar modelo NFL V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install numpy pandas requests

      - name: Comparar modelo original y V2
        run: python test_nfl_model_v2.py

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: nfl-model-v2-test
          path: data/model_v2_context_test.json
          if-no-files-found: error
          retention-days: 14
