
name: Evaluar modelo NFL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluacion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install numpy pandas requests

      - name: Entrenar y evaluar
        run: python build_nfl_model.py

      - name: Guardar diagnostico
        uses: actions/upload-artifact@v4
        with:
          name: nfl-model-diagnostics
          path: data/model_diagnostics.json
          if-no-files-found: error
          retention-days: 14
