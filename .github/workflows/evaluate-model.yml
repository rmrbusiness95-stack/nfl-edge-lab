
name: Evaluar modelo NFL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluacion:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install numpy pandas requests

      - name: Generar proyecciones del modelo
        run: python build_nfl_model.py

      - name: Comprobar archivo generado
        run: test -s data/model_diagnostics.json

      - name: Publicar resultados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model_diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar proyecciones experimentales NFL"
            git push
          fi

      - name: Guardar respaldo descargable
        uses: actions/upload-artifact@v4
        with:
          name: nfl-model-diagnostics
          path: data/model_diagnostics.json
          retention-days: 14
