
name: Archivar predicciones NFL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archivo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Crear registro historico
        run: python archive_nfl_predictions.py

      - name: Guardar registro en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prediction_snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "Archivar predicciones NFL"
            git push
          else
            echo "Sin registros nuevos"
          fi

      - name: Guardar respaldo descargable
        uses: actions/upload-artifact@v4
        with:
          name: nfl-prediction-snapshots
          path: data/prediction_snapshots/
          if-no-files-found: error
          retention-days: 30
