
name: Probar motor de ratings NFL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install numpy pandas requests

      - name: Evaluar motor alternativo
        run: python test_nfl_ratings_engine.py

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: nfl-ratings-engine-test
          path: data/ratings_engine_test.json
          if-no-files-found: error
          retention-days: 14
