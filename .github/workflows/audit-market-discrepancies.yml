
name: Auditar discrepancias con el mercado NFL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install numpy pandas requests

      - name: Comparar modelo contra mercado historico
        run: python audit_market_discrepancies.py

      - name: Comprobar resultado
        run: test -s data/market_discrepancy_audit.json

      - name: Guardar auditoria en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market_discrepancy_audit.json

          if ! git diff --cached --quiet; then
            git commit -m "Auditar discrepancias modelo mercado NFL"
            git push
          else
            echo "Sin cambios nuevos"
          fi

      - name: Guardar respaldo
        uses: actions/upload-artifact@v4
        with:
          name: nfl-market-discrepancy-audit
          path: data/market_discrepancy_audit.json
          if-no-files-found: error
          retention-days: 30
