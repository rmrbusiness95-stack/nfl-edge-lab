
name: Registro semanal NFL Edge Lab

on:
  workflow_dispatch:
  schedule:
    # Lunes 9 AM Arizona
    - cron: '0 16 * 9-12,1 1'
    # Viernes 3 PM Arizona
    - cron: '0 22 * 9-12,1 5'
    # Domingo 4 AM Arizona
    - cron: '0 11 * 9-12,1 0'

permissions:
  contents: write

concurrency:
  group: nfl-weekly-snapshot
  cancel-in-progress: false

jobs:
  registro:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install numpy pandas requests

      - name: Actualizar proyecciones independientes
        run: python build_nfl_model.py

      - name: Consultar cuotas
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_nfl_odds.py

      - name: Verificar fuentes
        run: |
          test -s data/model_diagnostics.json
          test -s data/nfl_odds_latest.json

      - name: Archivar historial de cuotas
        run: python archive_nfl_odds_history.py

      - name: Archivar predicciones originales
        run: python archive_nfl_predictions.py

      - name: Ejecutar motor de oportunidades V1
        run: python build_opportunity_engine.py

      - name: Ejecutar motor probabilistico V2
        run: python build_probability_engine.py

      - name: Ejecutar centro de decisiones V3
        run: python build_decision_center_v3.py

      - name: Registrar señales antes del kickoff
        run: python archive_nfl_signals.py

      - name: Comprobar resultados
        run: |
          test -s data/model_diagnostics.json
          test -s data/opportunity_engine.json
          test -s data/probability_engine_v2.json
          test -s data/decision_center_v3.json
          test -d data/signal_snapshots/
          find data/signal_snapshots -name '*.json' | grep -q .

      - name: Guardar historial en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/model_diagnostics.json
          git add data/nfl_odds_latest.json
          git add data/odds_history/
          git add data/prediction_snapshots/
          git add data/opportunity_engine.json
          git add data/probability_engine_v2.json
          git add data/decision_center_v3.json
          git add data/signal_snapshots/

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar motores y señales NFL Edge Lab"
            git push
          else
            echo "Sin cambios nuevos"
          fi

      - name: Respaldar registros
        uses: actions/upload-artifact@v4
        with:
          name: nfl-edge-lab-historial
          path: |
            data/odds_history/
            data/prediction_snapshots/
            data/signal_snapshots/
            data/opportunity_engine.json
            data/probability_engine_v2.json
            data/decision_center_v3.json
          if-no-files-found: error
          retention-days: 30
