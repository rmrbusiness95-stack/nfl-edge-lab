
name: Registro semanal NFL Edge Lab

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * 9-12 5'

permissions:
  contents: write

concurrency:
  group: nfl-weekly-snapshot
  cancel-in-progress: false

jobs:
  registro:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install numpy pandas requests

      - name: Actualizar proyecciones
        run: python build_nfl_model.py

      - name: Consultar cuotas reales
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_nfl_odds.py

      - name: Verificar fuentes
        run: |
          test -s data/model_diagnostics.json
          test -s data/nfl_odds_latest.json

      - name: Archivar antes de los partidos
        run: python archive_nfl_predictions.py

      - name: Guardar resultados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/model_diagnostics.json
          git add data/nfl_odds_latest.json
          git add data/prediction_snapshots/

          if ! git diff --cached --quiet; then
            git commit -m "Registrar proyecciones y cuotas NFL"
            git push
          else
            echo "Sin cambios nuevos"
          fi

      - name: Respaldar registros
        uses: actions/upload-artifact@v4
        with:
          name: nfl-weekly-snapshots
          path: data/prediction_snapshots/
          if-no-files-found: error
          retention-days: 30
