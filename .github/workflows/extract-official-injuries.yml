
name: Extraer lesiones oficiales NFL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraccion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4

      - name: Extraer reportes oficiales
        env:
          NFL_SEASON: '2026'
          NFL_WEEK: '5'
        run: python extract_official_nfl_injuries.py

      - name: Comprobar archivo
        run: test -s data/official_nfl_injuries.json

      - name: Publicar datos en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/official_nfl_injuries.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar lesiones oficiales NFL"
            git push
          else
            echo "Sin cambios nuevos"
          fi

      - name: Guardar respaldo
        uses: actions/upload-artifact@v4
        with:
          name: nfl-official-injuries
          path: data/official_nfl_injuries.json
          if-no-files-found: error
          retention-days: 14
